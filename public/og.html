<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<title>Makwad share image</title>
<meta name="robots" content="noindex" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@600;800&family=Readex+Pro:wght@400&family=IBM+Plex+Mono:wght@500&display=swap" />
<style>
  html, body { margin: 0; }
  .card { width: 1200px; height: 630px; box-sizing: border-box; padding: 72px 84px; position: relative; overflow: hidden;
    background: radial-gradient(700px 460px at 18% 50%, rgba(79,179,184,.28), transparent 70%), #0B1220; color: #F2F4F1;
    font-family: "Readex Pro", Tahoma, sans-serif; display: flex; flex-direction: column; justify-content: space-between; }
  .card::before { content: ""; position: absolute; inset: 0; background-image: radial-gradient(rgba(242,244,241,.12) 1.2px, transparent 1.4px); background-size: 28px 28px; }
  .card > * { position: relative; }
  .brand { display: flex; align-items: center; gap: 18px; }
  .brand small.lat { display:block; font-family:"Readex Pro"; color: rgba(230,236,245,.7); font-size: 16px; letter-spacing: .32em; margin-top: 10px; direction: ltr; text-align: right; }
  .brand small { display: block; font-family: "Alexandria"; color: #66CCCA; font-size: 22px; font-weight: 600; letter-spacing: .04em; margin-bottom: 18px; }
  .brand b { font-family: "Alexandria"; font-size: 46px; font-weight: 800; line-height: 1; }
  h1 { font-family: "Alexandria"; font-weight: 800; font-size: 62px; line-height: 1.3; margin: 0; max-width: 700px; }
  h1 em { font-style: normal; color: #66CCCA; }
  .foot { display: flex; justify-content: space-between; align-items: center; font-size: 26px; color: rgba(242,244,241,.75); }
  .url { font-family: "IBM Plex Mono", monospace; direction: ltr; font-size: 22px; }
  .phone { position: absolute; left: 90px; top: 90px; width: 230px; height: 450px; border-radius: 40px; background: #F2F4F1; padding: 10px; transform: rotate(-6deg); box-shadow: 0 40px 80px -30px rgba(0,0,0,.6); }
  .scr { width: 100%; height: 100%; border-radius: 31px; background: #fff; padding: 46px 16px 16px; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px; }
  .scr i { display: block; border-radius: 10px; background: #E3ECE7; }
  .scr i.a { background: #1F6F8B; height: 110px; }
</style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <svg width="84" height="84" viewBox="0 0 64 64"><defs><linearGradient id="go" x1="8" y1="58" x2="58" y2="10" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#4A6FC0"/><stop offset="1" stop-color="#66CCCA"/></linearGradient><mask id="mo" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64"><g fill="none" stroke-linejoin="round"><g stroke="#fff" stroke-width="8"><path d="M10 56 V20 Q10 11 18 11 Q22.5 11 24.5 15.5 L32 31 L40 11 V56"/><path d="M57 11 L44.5 31.5"/><path d="M44.5 37 L57 56"/></g><g stroke="#000" stroke-width="2.6"><path d="M10 53.3 V20 Q10 11 18 11 Q22.5 11 24.5 15.5 L32 31 L40 11 V53.3"/><path d="M55.5 13.4 L45.6 29.6"/><path d="M46.1 39.5 L55.5 53.6"/></g></g></mask></defs><rect width="64" height="64" fill="url(#go)" mask="url(#mo)"/></svg>
      <div><b>مكود</b><small class="lat">MAKWAD STUDIO</small></div>
    </div>
    <h1>حيث تُصنع<br /><em>التطبيقات</em></h1>
    <div class="foot"><span>تصميم وتطوير تطبيقات iOS وأندرويد والويب</span><span class="url">z6666c.github.io/satr</span></div>
    <div class="phone"><div class="scr"><i class="a"></i><i style="height:44px"></i><i style="height:44px"></i><i style="height:44px"></i><i style="height:44px;width:70%"></i></div></div>
  </div>
</body>
</html>
