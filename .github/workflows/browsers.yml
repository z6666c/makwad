name: Browser and security check

on:
  push:
    branches: [browsers]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Dependency audit
        run: npm audit --omit=dev > audit.txt 2>&1 || true
      - run: npm install --no-save --no-audit --no-fund playwright@1.47.2 && npx playwright install --with-deps chromium firefox webkit
      - name: Response headers
        run: |
          for u in https://z6666c.github.io/makwad/ https://z6666c.github.io/makwad/login https://z6666c.github.io/makwad/dashboard http://z6666c.github.io/makwad/; do
            echo "== $u"; curl -sI "$u" | grep -iE "^(HTTP|location|strict-transport|content-security|x-frame|x-content|server)" ; done > headers.txt 2>&1
          echo "== convex" >> headers.txt; curl -sI https://calm-mallard-903.eu-west-1.convex.cloud/version | grep -iE "^(HTTP|strict-transport|access-control)" >> headers.txt
      - run: node scripts/browsers.mjs
      - name: Publish results
        run: |
          mkdir -p out && cp -r shots/* out/ && cp audit.txt headers.txt out/
          cd out
          git init -q -b browsers-out
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add -A && git commit -q -m "Browser check $(date -u +%FT%TZ)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" browsers-out
